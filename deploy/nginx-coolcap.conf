# CoolCap 上线 Nginx 参考配置
server {
  listen 80;
  server_name your-domain.com;

  # 前端静态资源（vite base = /coolcap/）
  location /coolcap/ {
    alias /var/www/coolcap/dist/;   # 上传 dist/build/h5 内容到此目录
    try_files $uri $uri/ /coolcap/index.html;
  }

  # 后端 API 反向代理
  location /uniapp-api/ {
    proxy_pass http://127.0.0.1:8022/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
